<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 10 Speaking Test Trainer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            text-align: center;
        }

        /* Card Style */
        .card-container {
            width: 500px;
            height: 300px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            border: 2px solid #0056b3;
        }

        .card-front {
            font-size: 24px;
            font-weight: bold;
            color: #0056b3;
        }

        .card-back {
            transform: rotateY(180deg);
            font-size: 20px;
            line-height: 1.5;
            color: #333;
            flex-direction: column;
        }

        /* Button & Timer */
        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #timer {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #d9534f;
        }

        .topic-highlight {
            font-weight: bold;
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card-container">
        <div class="card" id="card">
            <div class="card-face card-front" id="front-text">
                Class 10 Speaking Test: Part 1
            </div>
            <div class="card-face card-back" id="topic-text">
                </div>
        </div>
    </div>

    <button id="nextBtn" onclick="nextTopic()">Get Task</button>
    <div id="timer">04:00</div>
</div>

<script>
    const topics = [
        "your personal goals",
        "your childhood",
        "doing chores",
        "traditions in your families",
        "your neighbourhood and interest groups",
        "your vision of the future",
        "your cooking habits",
        "fitness routines",
        "your favorite school subjects",
        "internships and volunteering",
        "nature protection",
        "democracy",
        "new inventions",
        "how you spend your money",
        "transportation and tourism",
        "digitalisation",
        "the role of music in your life",
        "theatre",
        "your favorite movies",
        "online games and series"
    ];

    let timerInterval;
    const card = document.getElementById('card');
    const topicText = document.getElementById('topic-text');
    const nextBtn = document.getElementById('nextBtn');
    const timerDisplay = document.getElementById('timer');

    function nextTopic() {
        const randomTopic = topics[Math.floor(Math.random() * topics.length)];
        
        topicText.innerHTML = `
            <p style="margin:0">In this part, I’m going to give you a topic to talk about.</p>
            <p style="margin:15px 0">Ask each other questions in order to find out about <span class="topic-highlight">${randomTopic}</span>.</p>
            <p style="margin:0">Keep the conversation going.</p>
        `;

        card.classList.add('is-flipped');
        nextBtn.disabled = true;
        nextBtn.innerText = "Next topic locked";

        // Timer auf 4 Minuten (240 Sekunden) gestellt
        startTimer(4 * 60);
    }

    function startTimer(duration) {
        let timer = duration, minutes, seconds;
        clearInterval(timerInterval);
        
        timerInterval = setInterval(function () {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            timerDisplay.textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(timerInterval);
                nextBtn.disabled = false;
                nextBtn.innerText = "Next Topic";
                timerDisplay.textContent = "04:00 - Ready!";
                card.classList.remove('is-flipped');
                document.getElementById('front-text').innerText = "Ready for the next one?";
            }
        }, 1000);
    }
</script>

</body>
</html>
